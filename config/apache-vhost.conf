# Apache virtual host for https://dashboard.plainsightsecurity.co.uk
#
# DO NOT enable this until the certificate files referenced below
# (SSLCertificateFile / SSLCertificateKeyFile) already exist on disk -
# Apache will refuse to start/reload otherwise. Use
# apache-vhost-bootstrap.conf first to obtain the certificate, then switch
# to this file. See README.md "Get a TLS certificate and enable the site"
# for the exact command sequence.
#
# Install to /etc/apache2/sites-available/dashboard.plainsightsecurity.co.uk.conf
# then:
#   sudo a2enmod ssl headers rewrite
#   sudo a2ensite dashboard.plainsightsecurity.co.uk
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# This assumes the app has already been deployed to
# /var/www/dashboard.plainsightsecurity.co.uk/ with DocumentRoot pointed at
# its public/ subfolder.

<VirtualHost *:80>
    ServerName dashboard.plainsightsecurity.co.uk
    Redirect permanent / https://dashboard.plainsightsecurity.co.uk/
</VirtualHost>

<VirtualHost *:443>
    ServerName dashboard.plainsightsecurity.co.uk
    DocumentRoot /var/www/dashboard.plainsightsecurity.co.uk/public

    <Directory /var/www/dashboard.plainsightsecurity.co.uk/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defense in depth: even though these folders sit outside DocumentRoot
    # (and so are not served by Apache regardless), explicitly deny them in
    # case DocumentRoot is ever repointed to the project root by mistake.
    <Directory /var/www/dashboard.plainsightsecurity.co.uk/src>
        Require all denied
    </Directory>
    <Directory /var/www/dashboard.plainsightsecurity.co.uk/scripts>
        Require all denied
    </Directory>
    <Directory /var/www/dashboard.plainsightsecurity.co.uk/database>
        Require all denied
    </Directory>
    <Directory /var/www/dashboard.plainsightsecurity.co.uk/config>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/dashboard-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dashboard.plainsightsecurity.co.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dashboard.plainsightsecurity.co.uk/privkey.pem

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    </IfModule>
</VirtualHost>
