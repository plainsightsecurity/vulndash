# TEMPORARY bootstrap vhost for https://dashboard.plainsightsecurity.co.uk
#
# Use this ONLY to obtain the first Let's Encrypt certificate, then replace
# it with apache-vhost.conf (which adds the :443 block, HSTS, and the extra
# per-directory hardening) once the certificate actually exists on disk.
#
# Why this file exists: Apache refuses to start or reload with ANY enabled
# vhost that references an SSLCertificateFile/SSLCertificateKeyFile path
# that doesn't exist - which is exactly the case the first time round,
# before certbot has issued anything yet. If apache-vhost.conf (the full
# one, with the :443 block already in it) is enabled at that point,
# `apache2ctl configtest` fails, and since that command fails for the whole
# server - not just this site - Apache won't start/reload at all until it's
# fixed. This minimal, port-80-only vhost has nothing for Apache to fail to
# find, so it sidesteps the problem entirely.
#
# See README.md "Get a TLS certificate and enable the site" for the exact
# command sequence this is used with.

<VirtualHost *:80>
    ServerName dashboard.plainsightsecurity.co.uk
    DocumentRoot /var/www/dashboard.plainsightsecurity.co.uk/public

    <Directory /var/www/dashboard.plainsightsecurity.co.uk/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/dashboard-access.log combined
</VirtualHost>
